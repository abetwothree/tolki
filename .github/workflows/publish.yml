name: Release Packages

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm document:version
          publish: pnpm ci:release
          title: "release: version packages"
          commit: "release: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display pnpm publish summary
        run: |
          if [ ! -f pnpm-publish-summary.json ]; then
            echo "No pnpm-publish-summary.json found, skipping tagging"
            exit 0
          fi
          echo "pnpm-publish-summary.json contents:"
          cat pnpm-publish-summary.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit readme updates
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "docs: update readme with new version [skip ci]"

      - name: Delete empty changesets and commit
        run: |
          deleted=false
          # Find changeset files with empty frontmatter (no packages listed)
          for file in .changeset/*.md; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = "README.md" ] && continue
            # Check if frontmatter is empty (just "---\n---")
            if head -2 "$file" | grep -qE '^---$' && [ "$(head -3 "$file" | tail -1)" = "---" ]; then
              echo "Deleting empty changeset: $file"
              git rm "$file"
              deleted=true
            fi
          done
          if [ "$deleted" = true ]; then
            git commit -m "chore: delete empty changesets [skip ci]"
            git push
          else
            echo "No empty changesets to delete"
          fi

      - name: Sync master into develop
        run: |
          git fetch origin master develop
          if git merge-base --is-ancestor origin/master origin/develop; then
            echo "develop already contains master"
          elif git merge-base --is-ancestor origin/develop origin/master; then
            git push origin origin/master:refs/heads/develop
          else
            # develop has commits of its own; merge in a separate worktree so this checkout stays untouched
            git worktree add -B develop "$RUNNER_TEMP/develop" origin/develop
            if ! git -C "$RUNNER_TEMP/develop" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              merge --no-edit origin/master; then
              echo "::error::master conflicts with develop; merge master into develop by hand"
              exit 1
            fi
            git -C "$RUNNER_TEMP/develop" push origin develop
          fi
